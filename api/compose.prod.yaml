
name: prod-api

services:

  db:
    image: postgres:18
    hostname: db
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-store}

  account:
    image: humbertosandmann/account:latest
    hostname: account
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    deploy:
      replicas: 1
    depends_on:
      - db

  product:
    image: ${PRODUCT_IMAGE:-humbertosandmann/product:latest}
    hostname: product

  exchange:
    image: ${EXCHANGE_IMAGE:-humbertosandmann/exchange:latest}
    hostname: exchange

  order:
    image: humbertosandmann/order:latest
    hostname: order
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PRODUCT_API_URL: ${PRODUCT_API_URL:-http://product:8080}
      EXCHANGE_API_URL: ${EXCHANGE_API_URL:-http://exchange:8080}
    depends_on:
      - db
      - product
      - exchange

  auth:
    image: humbertosandmann/auth:latest
    hostname: auth
    deploy:
      replicas: 1
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_HTTP_ONLY: ${JWT_HTTP_ONLY:-true}
    depends_on:
      - account

  gateway:
    image: humbertosandmann/gateway:latest
    hostname: gateway
    environment:
      CORS_ALLOWED_CREDENTIALS: ${CORS_ALLOWED_CREDENTIALS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - 8080:8080
