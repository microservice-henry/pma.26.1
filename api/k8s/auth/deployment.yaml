apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: humbertosandmann/auth:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: store-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_HTTP_ONLY
              valueFrom:
                configMapKeyRef:
                  name: store-configmap
                  key: JWT_HTTP_ONLY
