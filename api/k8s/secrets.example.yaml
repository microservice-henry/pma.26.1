# EXEMPLO — copie para secrets.yaml, preencha os valores e aplique com:
#   kubectl apply -f secrets.yaml
# NUNCA commite o secrets.yaml com valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: store-secrets
type: Opaque
stringData:
  DATABASE_USERNAME: change-me
  DATABASE_PASSWORD: change-me
  JWT_SECRET_KEY: change-me
