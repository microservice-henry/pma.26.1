apiVersion: v1
kind: ConfigMap
metadata:
  name: product-mappings
data:
  get-product.json: |
    {
      "request": { "method": "GET", "urlPath": "/products/0195abfb-7074-73a9-9d26-b4b9fbaab0a8" },
      "response": { "status": 200, "jsonBody": { "id": "0195abfb-7074-73a9-9d26-b4b9fbaab0a8", "price": 10.12 }, "headers": { "Content-Type": "application/json" } }
    }
  get-product-not-found.json: |
    {
      "priority": 1,
      "request": { "method": "GET", "urlPath": "/products/id-inexistente" },
      "response": { "status": 404 }
    }
