
name: store-api

services:

  db:
    image: postgres:17
    hostname: db
    ports:
      - 5432:5432
    volumes:
      - ${VOLUME_DB}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-store}
    networks:
      - app-net

  account:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    hostname: account
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    deploy:
      replicas: 1
    depends_on:
      - db
    networks:
      - app-net

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    hostname: auth
    deploy:
      replicas: 1
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_HTTP_ONLY: ${JWT_HTTP_ONLY:-true}
    depends_on:
      - account
    networks:
      - app-net

  order:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    hostname: order
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PRODUCT_API_URL: ${PRODUCT_API_URL:-http://product:8080}
      EXCHANGE_API_URL: ${EXCHANGE_API_URL:-http://exchange:8080}
    deploy:
      replicas: 1
    ports:
      - 8085:8080
    depends_on:
      - db
      - product
      - exchange
    networks:
      - app-net

  product:
    image: wiremock/wiremock:3.3.1
    hostname: product
    volumes:
      - ./mocks/product:/home/wiremock
    networks:
      - app-net

  exchange:
    image: wiremock/wiremock:3.3.1
    hostname: exchange
    volumes:
      - ./mocks/exchange:/home/wiremock
    networks:
      - app-net

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    hostname: gateway
    environment:
      CORS_ALLOWED_CREDENTIALS: ${CORS_ALLOWED_CREDENTIALS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - 8080:8080
    depends_on:
      - account
      - auth
      - order
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    ports:
      - 9090:9090
    volumes:
      - ${SETUP}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-net

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - ${SETUP}/grafana:/var/lib/grafana
      - ${SETUP}/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - app-net

networks:
  app-net:
